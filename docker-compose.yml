# Loads the workbooks into build/attractions.duckdb, then serves the api and
# the web app on port 8080.

services:
  load:
    image: attractions-api:local
    # Built by the api service, never in a registry.
    pull_policy: never
    # Only the setting the load uses, so the API key never reaches it.
    environment:
      APP_TODAY: ${APP_TODAY:-2026-10-05}
    command: ["python", "-m", "pipeline.load"]
    volumes:
      - ./data:/app/data:ro
      - ./build:/app/build

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: attractions-api:local
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      load: { condition: service_completed_successfully }
    volumes:
      - ./build:/app/build:ro
    ports: ["8000:8000"]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]
