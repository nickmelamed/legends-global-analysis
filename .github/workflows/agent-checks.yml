name: agent checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hook smoke test
        run: python3 scripts/agent/smoke_test.py
      - name: Style of changed lines
        run: python3 scripts/agent/check_style.py --changed .
      - name: Test weakening (reported, approved in review)
        run: python3 scripts/agent/check_tests.py --warn
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Not make setup, which also installs the pre-commit hooks. The
      # supplied data/ is not in git, so the one test that needs the database
      # skips here and runs locally after make load.
      - name: Project checks
        run: |
          pip install -e ".[dev]"
          npm --prefix web ci
          make ci
